#   as segment breakdowns (same rule as p1_v3 v07). 2023_zh p71 / 2024_zh p52 "47亿5800万" (insurance service expense) -> unrelated
#   (2024_zh p52 is kept for its income-statement row "非利息收入 4,718 3,862").
