# aliases_draft.yaml - candidate alias table for OCBC annual reports (ar 2023/2024/2025, en+zh)
# Method: PyMuPDF page.get_text() on every page of the six PDFs data/raw/ocbc-group_ar_{2023,2024,2025}_{en,zh}.pdf.
#   Normalisation: zh docs -> remove ALL whitespace (re.sub(r'\s+','',t)); en docs -> collapse whitespace to one space.
#   Matching: variants with `case_insensitive: true` use re.I; all others (abbreviations, title-case forms, zh) are case-sensitive,
#   abbreviations use a letter-boundary guard (?<![A-Za-z])X(?![a-z]) so 'CET1CAR' in de-spaced zh text still matches).
#   en variants are scanned in all six docs (in zh docs the regex is applied with spaces removed); zh variants only in zh docs.
#   `regex` = the exact pattern used (as applied to the variant's own language). pages = physical PDF page index from 1
#   (first 15 listed), total = number of distinct pages with >=1 hit.
# kind: alias | abbreviation | related_not_alias | user_spelling (0 hits in the reports; kept as a user-query form).
#   Variants that were planned as alias but got 0 hits are auto-downgraded to user_spelling.
# absent_in: per doc of each language, whether the canonical name (name.en / name.zh) never occurs, and what the doc uses instead.
# Caveats: zh reports are partial translations (~200 pages) - they lack the full MD&A section (pages ~96-110 of en),
#   so many MD&A-only metrics (leverage ratio, LCR, NSFR, loans-to-deposits, NIM in 2025) have no zh wording at all.
#   Snippets are verbatim substrings of the normalised page text (zh therefore has no spaces).
