  question: 华侨银行过去三年净利润的增长率是多少？
  runner: mcp_client
  session_key: cc_27b10aeb9e778b0247665a3ed3527608
  answer: |-
    这里的“过去三年”指库内最新期间往前数三年，即 2023–2025 财年；以 2022 年为基期。指标用的是“归属于本行股东的净利润”（Net profit attributable to equity holders of the Bank）。

    **结论：** 华侨银行这三年的净利润增速一路放缓，2025 年小幅下降。2025 年比 2022 年累计增长约 34.3%，年均复合增长率约 10.3%。

    | 财年 | 净利润（百万新元） | 同比增长 |
    |---|---|---|
    | 2022（基期，已重述） | 5,526 | — |
    | 2023 | 7,021 | +27.1% |
    | 2024 | 7,587 | +8.1% |
    | 2025 | 7,422 | −2.2% |

    出处：集团五年摘要（Group Five-Year Summary）（ocbc-group_ar_2025_en，物理页 4，印刷页 2）。金额单位为百万新元，原文写作 "$ million"。增长率是我根据表中数字算的，原文没有直接给出。

    **几点说明：**
    - **事实状态：** 各年数值在多个来源中一致。2022–2024 年有 4–6 个来源，2025 年有 2 个来源。2023 年和 2024 年的数字分别与当年年报一致：2023 年（ocbc-group_ar_2023_en，物理页 4，印刷页 2），2024 年（ocbc-group_ar_2024_en，物理页 6，印刷页 4）。这两页我没有逐页读原文，是数据工具给出的对应关系。
    - **重述：** 原文脚注说，2022 年的数字因采用 SFRS(I) 17 而重述。最初公布 2022 年数字的那份年报不在库内，所以无法与原始口径比较。上面的 2022 年基期用的是重述后的 5,526 百万新元。
    - **口径：** 如果改用现金基础净利润（不含无形资产摊销），同一张表里 2022–2025 年分别为 5,630、7,124、7,646、7,443 百万新元。
