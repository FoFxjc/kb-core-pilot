  - {concept: tier1_car, field: row_labels, dropped: "Tier 1", why: "generic row label; would match held-out test spelling h04 Tier 1 ratio (A's doubt 4)"}
  - {concept: tier1_car, field: row_labels, dropped: "一级资本", why: "generic row label; part of \"普通股权一级资本\" (CET1 capital) (A's doubt 4)"}
  - {concept: total_car, field: row_labels, dropped: "总资本", why: "generic row label (A's doubt 4)"}
