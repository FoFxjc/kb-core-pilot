  start_page_text: 银行账户利率风险(IRRBB) IRRBB是指银行的资本和盈利所面对的 当前和潜在性的利率风险。IRRBB管理 的基本目标是确保利率风险敞口与我们 的风险偏好保持一致，并维持在既定的 风险承受范围内。 利率风险识别
    利率风险来自于在不同时间重新定价 (差距风险)，通过参考不同的利率基准 (基准风险)进行重新定价，或者在不同 情况下对现金流量时机或利率重置实 施可选择性(可选择性风险)的利率敏感 工
