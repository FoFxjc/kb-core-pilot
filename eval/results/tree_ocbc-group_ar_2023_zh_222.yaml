  start_page_text: 吳靜儀 集团首席财务官 在我看来，2023年是华侨银行具 有里程碑意义的一年。我们不仅取得 了强劲业绩，也采取了推动未来数年的 增长的策略行动。今年的年度报告主题 – “集团一体，展现优势。品牌一体， 彰显实力。”
    – 概括表达了我们聚焦之 处。我们遵循企业策略的指引，不仅进 一步加强了，也会持续推动我们独特的 “集团一体”理念来协助客户，在整个东 盟与大中华区寻求增长。 聚焦资本管理落实明确的派
