# - h12 2025: 2024-report statements "total dividend payout for 2024 and 2025 will amount to 60%" (2024_en p7/11/12/15/36/77/99/100,
#   2024_zh p7/12/15/34) are forward-looking targets made before FY2025 -> NOT gold for 2025 (they are gold for 2024).
#   2025_en p100 ("target payout ratio of 50% for ordinary dividend and 10% for special dividend") does not state 60% -> not added.
# - h13: zh reports contain no loans-to-deposits ratio (no zh MD&A) -> en-only gold.
# - h14: other "33,6xx" hits are unrelated table values. zh reports have no staff-strength table -> en-only gold.
