  - {concept: wealth_aum, field: variants, dropped: "财富管理的资产管理规模", why: "same as above: expands to \"的 / 资产 / 管理 / 规模\"; with both removed, v05 2023 recovered (2024 back to its pre-P2-2 miss)"}
