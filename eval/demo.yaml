  question: 华侨银行过去三年（2023–2025）的信贷成本是多少？
  runner: mcp_client
  session_key: cc_0a415be11e8744e7e1b4d41fd687a7d9
  answer: |-
    华侨银行集团 2023 到 2025 年的总信贷成本分别是 20、19、17 个基点（以贷款为基数），逐年下降。

    | 年份 | 信贷成本 | 总拨备 | 出处 |
    |---|---|---|---|
    | 2023 | 20 个基点 | 7.33 亿新元（比 2022 年的 5.84 亿新元增加 25%） | （ocbc-group_ar_2023_en，物理页 97，印刷页 95）；拨备金额见同一文档物理页 96 与 101，印刷页 94 与 99 |
    | 2024 | 19 个基点 | 6.90 亿新元（同比下降 6%） | （ocbc-group_ar_2024_en，物理页 99–100，印刷页 97–98） |
    | 2025 | 17 个基点 | 6.65 亿新元（同比下降 4%） | （ocbc-group_ar_2025_en，物理页 99–100，印刷页 97–98） |

    - **2023 年**：年报原文是“NPL ratio of 1.0% and credit costs at 20 basis points”。
    - **2024 年**：原文是“total credit costs of 19 basis points of loans were below the previous year's 20 basis points”。
    - **2025 年**：原文是“Credit costs were lower at 17 basis points of loans, compared to 19 basis points a year ago”。年报把总拨备下降主要归因于非减值资产拨备减少。

    **数据说明**
    - **数据来源**：知识库的结构化指标里没有收录“信贷成本”，以上数字都是我从英文年报“管理层讨论与分析”的概述部分逐页读出来的。这些年报的关键财务比率表里没有这一项。
    - **前后一致**：2024 年报写明上年是 20 个基点，2025 年报写明上年是 19 个基点，和各年当年的披露一致，没有看到重述。
    - **单位**：金额单位是新元。
    - **中文版**：知识库里有中文版年报，但这次没有查，以上都来自英文版。
