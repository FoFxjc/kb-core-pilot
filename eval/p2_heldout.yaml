# Each question uses one held-out spelling (heldout_term, registered in eval/heldout_terms.yaml); variant_of is the official spelling in the annual report.
# Main-session check 2026-10-19: every evidence snippet re-extracted from the PDF page (0 mismatches), each spelling appears on 0 pages of the 6 PDFs, every answer number appears in the evidence.
# Removed h02 ROA, h03 NSFR, h08 拨备覆盖率, h13 存贷比: these 4 spellings were already in the pre-P2 alias table (query_only) and cannot be held-out spellings; B added h15-h20.
# Below are the header notes of B's two files (method, regexes, removed pages and reasons), kept verbatim.
#
# P2 held-out-term evaluation set (author: subagent B), generated 2026-10-19.
#
# PURPOSE
# - Each question uses one "held-out term": a natural user wording for a metric that is NOT the annual report's own
#   wording. 14 terms (7 en, 7 zh), one metric each; 10 single_value + 4 cross_year questions.
# - Held-out check: every term was normalised (lower-case; whitespace/hyphen/en-dash runs -> one space) and searched in
#   ALL pages of the 6 PDFs (en: word-boundary match on the collapsed text; zh: substring match on the text with all
#   whitespace removed). All 14 terms: 0 pages (see heldout_terms.yaml).
#
# METHOD (same as eval/p1_v3.yaml)
# - Sources: ONLY data/raw/ocbc-group_ar_{2023,2024,2025}_{en,zh}.pdf, text via PyMuPDF page.get_text().
#   Pages are PHYSICAL page numbers (PDF index + 1).
# - For every question-year the regexes below were run (case-insensitive) over EVERY page of ALL SIX PDFs:
#   en pages whitespace-collapsed; zh pages both collapsed and with all whitespace removed. Every hit was reviewed
#   by hand; kept pages state the answer for THAT year: own-year report (highlights, letters, CFO review, MD&A,
#   five-year summary, capital table, primary income statement, the note that itemises the metric) AND later
#   reports' prior-year comparatives.
# - Evidence snippets are verbatim substrings of the whitespace-collapsed page text (zh matches found in the
#   whitespace-removed text were mapped back to the collapsed text). One snippet per gold (year, doc, page).
#
# REGEXES USED
#   h01 2024: Net asset value(?: ?\(\d\))*(?: [\d.]+){0,4} 12\.80 || (net asset value|NAV)[^.]{0,60}\$?12\.80 || 资产净值(?: ?\(\d\))*(?: [\d.]+){0,4} 12\.80 || 12\.80
#   h02 y/v in (2023,1.46),(2024,1.53),(2025,1.37): Return on assets(?: ?\(\d\))*(?: [\d.]+){0,4} v || (return on assets|ROA)[^%]{0,60}v || 资产回报率(?: ?\(\d\))*(?: [\d.]+){0,4} v || 资产(回报|收益)率[^。]{0,30}v
