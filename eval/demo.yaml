- id: d5
  lang: zh
  layer: trap question
  question: 2025 年中文版年报的管理层讨论与分析是怎么解释净利息收入变化的？
  runner: mcp_client
  session_key: cc_a8544868201ad1b54011e9a740e2e222
  answer: |-
    **先说结论：2025 年中文版年报里没有"管理层讨论与分析"（MD&A）这一章。** 据检索系统说明，中文版只是节选，不含 MD&A、风险管理、公司治理、业务回顾等章节，但财务报表和全部附注都在。下面分两部分：中文版里最接近的内容是"集团首席财务官综述"；MD&A 原文只在英文版里有。

    ## 一、中文版：集团首席财务官综述（物理页 24–25，印刷页 22–23）

    综述里关于净利息收入的说法是：
    - **下降原因**：集团收入创新高，主要靠非利息收入大范围的强劲增长，这部分增长足以抵消"关键基准利率大幅度显著下降而减少的净利息收入"（ocbc-group_ar_2025_zh，物理页 24，印刷页 22）。
    - **缓解因素**：净利息收入的下降，靠三点得到缓解：持续的贷款增长、积极管理资金成本、积极管理资产负债表（包括把多余流动性配置到收益增厚的优质资产）（同上）。
    - **相关背景**：按恒定汇率计算，贷款增长 9%，达到 3410 亿元；客户存款增长 10%，主要来自往来与储蓄存款（CASA），CASA 比率升到将近 51%（ocbc-group_ar_2025_zh，物理页 25，印刷页 23）。

    这一节只有定性解释，没有给出净利息收入的金额。中文版的财务报表附注 3"净利息收入"（物理页 77，印刷页 75）有逐项数字，但这一页我没有读。

    ## 二、英文版 MD&A（ocbc-group_ar_2025_en）

    **总览表**（物理页 98，印刷页 96）：
    - 净利息收入从 2024 年的 9,755 百万新元降到 2025 年的 9,150 百万新元，降幅 6%。
    - 净息差从 2.20% 降到 1.91%。

    **净利息收入一节**（物理页 101，印刷页 99）用表格分析变化。我读到的这一页只有表格，没有文字叙述。

    1. **平均资产负债表**
       - 生息资产平均余额从 443,419 百万增至 478,684 百万新元，平均收益率却从 5.06% 降到 4.19%。其中，客户贷款收益率从 5.25% 降到 4.32%。
       - 付息负债平均成本从 3.06% 降到 2.43%。其中，非银行客户存款成本从 2.84% 降到 2.27%。

    2. **量价分析**（单位：百万新元）

       | 项目 | 规模因素 | 利率因素 | 净变化 |
       |---|---|---|---|
       | 利息收入 | +1,632 | −3,938 | −2,306 |
       | 利息支出 | +974 | −2,702 | −1,728 |
       | 对净利息收入的影响 | +658 | −1,236 | −578 |

       再加上天数变化带来的 −27，净利息收入合计减少 605 百万新元。

    可以看出，英文 MD&A 的表格把下降拆成两部分：利率下降是主要拖累，规模扩张起了部分抵消作用。这和中文版首席财务官综述的说法一致。

    ## 数据说明
    - 系统的事实层里，2025 年净利息收入 S$9,150m 只有一个来源，就是英文 MD&A 总览表。我已经读原文核对过。
    - 没有发现重述。
