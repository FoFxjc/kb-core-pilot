  start_page_text: 资本管理 资本政策 集团资本管理政策的关键目标是，保持 良好的资本状况，为业务发展和策略投 资提供支持，并维持投资者、存款者、 客户及市场信心。据此，集团的目标是 维持其信贷评级至少为”A”级，并确保 其资本比率高于监管最低要求，同时也
    兼顾到股东要求持续回报的期望及高 标准的谨慎态度。集团积极管理其资本 结构，力求以最佳资本工具组合保持低 资本成本。 资本监控与计划 集团的资本受到严密监控及积极
  verdict: correct
  note: toc_group title (accepted rule).
