  answer: |-
    **结论：没有变化。2025 年和 2024 年华侨银行集团的不良贷款率都是 0.9%。**

    - **关键财务比率表**：2025 年报的管理层讨论与分析（MD&A）有一张关键财务比率表，“Non-performing loan ratio”一行 2025 年为 0.9%，2024 年也是 0.9%（ocbc-group_ar_2025_en，物理页 98，印刷页 96）。
    - **MD&A 正文**：原文写的是 “NPL ratio remained unchanged at 0.9%”，即截至 2025 年 12 月 31 日，不良贷款率维持在 0.9% 不变（ocbc-group_ar_2025_en，物理页 100，印刷页 98）。

    **同一段里的其他资产质量数据**（ocbc-group_ar_2025_en，物理页 100，印刷页 98）：
    - 不良资产总额为 32.4 亿新元（$3.24 billion），比一年前增加 13%。
    - 不良资产拨备覆盖率为 151%。
    - 2025 年总拨备为 6.65 亿新元，下降 4%。
    - 信贷成本从 19 个基点降到 17 个基点。

    **数据核对情况**：
    - 2024 年的 0.9% 有两个来源，结果一致：2024 年报和 2025 年报的比率表。没有重述。
    - 2025 年的 0.9% 目前只有 2025 年报一个来源。
    - 我只读了 2025 年报的原文。2024 年报中对应的页面（物理页 98，印刷页 96）我没有读。

    **补充说明**：
    - 以上来自英文版年报。2025 年报还有中文版，这次没有查。
    - 2025 年报 MD&A 的“Non-Performing Assets”一节（物理页 105，印刷页 103）按地区列出了不良贷款率，我没有读这一页。
