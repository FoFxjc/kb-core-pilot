  start_page_text: 吉隆坡 2023年，吉隆坡唯一的大型脚车活动华侨银行骑车乐再次回归。这项活动 由于疫情停办了三年，这次复办让超过2000名骑手得以在市内封闭道路上 骑行。 活动是在吉隆坡一段无阻碍的封闭道路上举行，能看到辽阔的城市天际线
    和国油双峰塔，骑手参加21公里或42公里的项目，尽情欣赏吉隆坡的美丽 景观。 在马来西亚，骑手抵达独立广场，完成城市骑车之旅。 我们的年轻骑手走上澳门街头炫耀他们绚丽独特的服装。
