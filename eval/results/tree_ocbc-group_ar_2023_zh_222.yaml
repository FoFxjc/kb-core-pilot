  start_page_text: 李国庆 主席 在2023年，地缘政治事件与宏观经济 挑战依然持续。利率和物价通胀均维持 在高位，我们也目睹了银行倒闭事件。 我们正处于前所未见的不确定因素， 而华侨银行需要步步为营，采取深思 熟虑的方式来为今天和未来做好定位
    和应对。 尽管如此，我们在过去一年里谨慎前 行、灵活应对，并欣然在此与股东们分 享，华侨银行在2023年实现了创纪录的 财务业绩。我们在推进策略措施取得了 重大进展，并继续体
