[project]
name = "kb-core"
version = "0.1.0"
description = "Interpretation, retrieval and agent layer over kb-intake delivery packages (Postgres + Elasticsearch)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "jieba==0.42.1",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
    "pymupdf==1.28.2",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.scripts]
kb-core = "kb_core.cli:main"

[dependency-groups]
dev = ["import-linter==2.1", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_core"]

[tool.hatch.build.targets.wheel.force-include]
"contract" = "kb_core/_data/contract"
"migrations" = "kb_core/_data/migrations"
"queries" = "kb_core/_data/queries"
"es" = "kb_core/_data/es"
"profiles" = "kb_core/_data/profiles"
"domains" = "kb_core/_data/domains"
"config" = "kb_core/_data/config"
"constraints.txt" = "kb_core/_data/constraints.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: needs a Postgres (KB_CORE_TEST_PG_DSN)",
    "es: needs Elasticsearch (KB_CORE_TEST_ES_URL)",
]

[tool.importlinter]
root_packages = ["kb_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kb-core does not import kb-intake or kb"
type = "forbidden"
source_modules = ["kb_core"]
forbidden_modules = ["kb_intake", "pipeline", "service", "scripts"]
