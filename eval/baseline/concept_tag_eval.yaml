# Manual spot check of node concept tags (p2-design §3.3; scripts/p2_tag_sample.py; judged by the main session, 2026-10-19).
# Criterion (D39): a tag is correct = the node actually reports or discusses the concept (it is the title, a table has its row, or the text gives its value or change);
#   a node is correct only if all its tags are correct (same standard as the D22 tree spot check, "all three correct"); per-tag accuracy recorded too. Threshold 85% (node level).
# Sampling: 40 tagged primary-tree nodes per language. Below threshold: fix the rules, then resample with a new seed (never accept on a sample the rules were tuned on); every round is recorded.
# Rule versions: r1 = rule_dict >= 2; r2 = + F1-F5; r3 = + F6; r4 = F1 changed to F1' (shared pages split by title position; final version). See pipeline/concepts.py and p2b-report §3.
