#   h05 2024: credit costs?[^.]{0,80}19 (basis points|bps) || 信贷成本[^。]{0,40}19个?基本点 || 19个?基点 || 19 ?(basis points|bps) || 0\.19%
#   h06 2025: 2,411 || \$2\.41 billion || \$2\.4\d? billion || 24亿1000万 || 24亿 || 24\.1亿
#   h07 2025: Staff costs[^.]{0,30}3,907 || 员工成本[^。]{0,30}3,907 || 3,907 || \$3\.91 billion || 39亿0700万
#   h08 2024: (coverage|覆盖)[^.。]{0,80}159 || 159% || \b159\b
#   h09 2024: 4,718 || \$4\.72 billion || \$4\.7\d? ?(billion|bn) || 47亿2000万 || 47亿 || 47\.2亿
#   h10 2025: 14,614 || \$14\.6\d? billion || 146亿
#   h11 2024: 8,976 || \$8\.98 billion || \$9\.0 billion || 89亿7600万 || 89亿8
#   h12 2023: payout[^.]{0,100}53% || paying out 53% || 53%[^.]{0,60}payout || (派息率|派息)[^。]{0,60}53% || 49% 53% 53%
#   h12 2024/2025: payout[^.]{0,100}60% || 60%[^.]{0,60}payout || (派息率|派息)[^。]{0,60}60% || 50% 60% || 60% 60% || 60% of (Group )?net profit
#   h13 y/v in (2023,80.5),(2024,80.7),(2025,78.6): Loans[ -]to[ -]deposits[^%]{0,40}v || v%? || 贷款[^。]{0,20}存款[^。]{0,20}v
#   h14 2024: 33,656 || staff strength[^.]{0,60}33,656 ; plus 33,6\d\d
#
# EXCLUSIONS (and why)
# - h01: none needed (12.80 hits are all NAV rows).
# - h04 2025: 2023_zh p4 and 2024_zh p6 contain "17.6" but it is the Total CAR for 2021/2022 (and 2021 Tier 1 in 2025 report
#   is 16.0) -> dropped. Capital-management tables (2023_en p76, 2024_en p78, 2025_en p78, 2023_zh p41, 2024_zh p35,
