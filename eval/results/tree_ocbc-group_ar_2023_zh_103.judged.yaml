  start_page_text: 其他资讯 其他资讯是由管理层所负责。其他资讯包括董事声明 (但不包括财务报告与我们的审计师报告) 与年度报告的其他章节 (“其他章节”)，我们 在此审计师报告日期之前已经取得董事声明，年度报告的其他章节预计在此日期之后提供给我们。
