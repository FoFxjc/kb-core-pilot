  start_page_text: 风险管理 表1：主要风险类型 主要风险 定义 信贷风险 信贷风险是指债务人或交易对方由于其信贷型态出现不良变化而无法履行金融或合约义务所导致本金和/或 收入损失的风险。 市场风险 市场风险是指由于利率、汇率、信贷息差以及股权与大宗商品价格等因素的波动，或者其产生自交易和/或银
    行活动的波动性和相关性而导致收入和/或市场价值损失的风险。 流动性风险 流动性风险是指无法履行到期的金融与现金流出义务的风
