  - {concept: customer_loans, added_exclude: ["allowances for impaired loans to customers", "allowances for non-credit-impaired loans to customers", "impairment of loans to customers", "减损客户贷款准备金", "非信贷减损客户贷款的准备金", "客户贷款的减损", "客户贷款的准备金"], why: "first tagging spot check (2026-10-19): allowances for and impairment of loans to customers are not the customer loan balance (note 28 titles, key audit matters)"}
