  start_page_text: '马来西亚 珊瑚礁 作为2025年华侨银行马来西亚可持续性发展周的活动之一，亚庇分行前往沙巴州乌 苏干岛协助海洋保育工作。该团队培育了143个珊瑚碎块，让当地原住民社区的4,000 名成员受益。这些珊瑚碎块随后被移植到华侨银行认养的珊瑚苗圃（由华侨银行及
    员工捐赠5万3900令吉资助）。健康的珊瑚礁在气候适应、保护海岸线免受风暴和侵 蚀，以及在维持渔业、保育和旅游相关活动的生计方面发挥着重要作用。 '
