# p1 cross-year questions (cross_year), independent gold set -- draft
#
# Independence: this file was produced only from the 6 original PDFs under data/raw/ (PyMuPDF text) + regexes + manual checks;
#   service/, pipeline/, scripts/, data/jsonl/, data/t3/ were not read and 127.0.0.1:8100 was not called.
# Pages: physical page = PDF page index (1-based), not the printed page number.
# Method: whitespace on each page collapsed to single spaces, then case-insensitive regexes scanned every page of all 6 PDFs;
#   each hit was checked in its context snippet and passing mentions were removed.
#
# Recall regexes (candidate scan):
#   x01 NPL:   (?i)non[- ]?performing loans? (\(NPL\) )?ratio|NPL ratio|不良贷款[^率]{0,4}(比|率)|不良.{0,6}比率
#              + table rows: Group <year> ... <ratio> (MD&A "NPL Ratio %" regional table)
#   x02 credit costs: (?i)credit costs?|信贷成本|信用成本 ; extra scan (?i)\bbps?\b|basis point|个基点|基本点
#   x03 CET1:  (?i)CET ?1|Common Equity Tier 1|普通股权?一级|普通股权Tier ?1 ; extra scan for values 15\.9 ?%|17\.1 ?%|16\.9 ?%
# Criterion per (question, year): the page must contain "metric name + that year's value":
#   x01-2024: 0.9% (2024 report); in the 2025 report it must be "unchanged/维持不变 at 0.9%", "stable at 0.9% since mid-2024" or the 2024 column of a comparison table
#   x01-2025: 0.9% (2025 report only)
#   x02-2023: 20 (basis points|个基点); x02-2024: 19; x02-2025: 17
#   x03-2023: 15.9; x03-2024: 17.1 (transitional basis); x03-2025: 16.9 (transitional basis)
#
# Removed, with reasons:
#   - 2023_en p39 / 2024_en p39 (CRO interview) "NPL ratio ... around 1% / hovering at around 1%": approximate, not an explicit statement of that year's 0.9% (not included for x01).
#     But 2023_en p39 / 2023_zh p38 "credit costs ... around 20 basis points" gives an explicit value; included for x02-2023.
#   - 2025_en p25 / p38 / p99, 2025_zh p25 "stable/steady at 0.9%": included for 2025 only, not as 2024 evidence (no explicit comparison with the prior year).
#   - 2023_en p104 / 2024_en p106 / 2025_en p106 "Total NPLs ... % of gross loans 0.9": the value is the NPL ratio but not labelled "ratio";
#     implicit, not included (can be added under a looser standard).
#   - 2024_en p39 "Credit costs for 2024 were well contained": no value.
#   - 2025_en p9 (chairman's statement) gives only fully-loaded CET1 15.1%, a different basis from this question's transitional 16.9%; not included;
#     2024_en p36 "14% target for CET1": a target, not an actual value.
#   - regulatory minimums in each report's capital management section (6.5% / 9.0%), ordinary-share eligibility notes ("qualify as CET1 capital"),
#     and the incidental 17.1% in impairment-test discount-rate tables (2023_en p205, 2024_en p204, 2023_zh p145, 2024_zh p124) are unrelated numbers.
#   - country/region ratios in the MD&A regional NPL table and "basis point" in rate sensitivity / PV01 are unrelated mentions.
# Not found: the five-year summary (Financial Highlights / 财务重点) has no NPL ratio or credit costs; the 2024 Chinese edition has no CFO review,
#   and 2024 credit costs of 19 bps do not appear in it; no Chinese edition has the MD&A regional NPL table. Every value for every question and year was found.
# Note: x03 2024/2025 are transitional-basis values under MAS's final Basel III reforms; fully-loaded values are 15.3% / 15.1% (not used as answers).
