  - {concept: total_income, field: query_only, dropped: "total revenue", why: "same as above: revenue is generic"}
  - {concept: allowances, field: query_only, dropped: "loan loss provisions", why: "held-out test spelling h15"}
  - {concept: allowances, field: query_only, dropped: "provisions", why: "would match held-out test spelling h15"}
  - {concept: allowances, field: query_only, dropped: "拨备", why: "would match held-out test spelling h18 拨备前利润 (A also flagged it as doubtful)"}
  - {concept: operating_profit, field: query_only, dropped: "拨备前利润", why: "held-out test spelling h18"}
