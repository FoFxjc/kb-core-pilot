  start_page_text: 让AI、数字化与数据更为具人性化 虽然AI、数字化与数据蕴含巨大潜力，并有望重塑整个行业，但它 也是一把双刃剑。随着自动化加速，当前的许多职位可能会演变 甚至消失。个人与组织都必须不断学习新技和加以适应，才能与
    时并进和保持韧性。 正因如此，我们在重新设计工作模式时都采取以围绕人为核心 重新设计工作为基础。整个集团内部已有许多团队开始主动探 索如何利用AI、数字化与数据来协助他们更高效地履行职责。
