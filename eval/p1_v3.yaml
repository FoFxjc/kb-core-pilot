# P1 v3 gold-set draft (independent author "goldA"), generated 2026-10-16.
#
# METHOD
# - Sources: ONLY data/raw/ocbc-group_ar_{2023,2024,2025}_{en,zh}.pdf, text via PyMuPDF page.get_text().
#   Pages are PHYSICAL page numbers (PDF index + 1), not printed labels.
# - For every question-year the regexes below were run (case-insensitive) over EVERY page of ALL SIX PDFs:
#   en pages with whitespace collapsed to single spaces; zh pages both collapsed and with all whitespace removed.
#   Every hit was reviewed by hand; the pages kept are those that state the answer for THAT year.
# - Pages kept INCLUDE: the year's own report (highlights, Chairman/CEO/CFO letters, MD&A, five-year summary,
#   charts whose series clearly maps to the year, consolidated income statement / capital table), AND the later
#   reports' prior-year comparatives (MD&A comparative column, five-year summaries, charts, "x% from y a year ago").
#   Graders that want own-year-only can filter gold by doc_id year.
# - Evidence snippets are verbatim substrings of the whitespace-collapsed page text (for zh hits found in the
#   whitespace-removed text, the snippet is mapped back to the collapsed text). One snippet per gold (year, doc, page).
#
# EXCLUSIONS (and why)
# - v01 2025: 2024_zh p14 ("支出收入比例依然低于40%") is a 2024 statement.  Rounded "40%" statements for 2025 (2025_en p9/p25,
#   2025_zh p9/p25) were KEPT because they explicitly state the 2025 CIR.
# - v02 (net profit): statements of changes in equity, EPS note and unappropriated-profit note (number reused as an input,
#   not reported as the result): 2023_en p126/163/169, 2023_zh p74/103/109, 2024_en p128/129/162/168, 2024_zh p55/56/82/88,
#   2025_en p128/129/162/169, 2025_zh p57/58/83/90.  Kept the consolidated income statement pages.
# - v03 2025: 2023_en p96/p99 contain "1.91" but it is the 2022 NIM.
# - v04 (ROE 13.7% in both 2023 and 2024): pages where 13.7 refers only to the other year were dropped
#   (2023: 2024_en p10/p99, 2024_zh p10, 2025_en p98; 2024: 2023_en p4/8/96/97, 2023_zh p4/8/10).
# - v07 (total income): segment / geographic breakdown tables whose total row equals Group total income
#   (2023_en p108/206/208, 2023_zh p146/148, 2024_en p110/205/206/207, 2024_zh p125/126/127, 2025_en p110/207/208/209,
#   2025_zh p128/129/130) — excluded as regional/segment breakdowns.
# - v10 (2024 NPL ratio 0.9%): 2025-report statements of the 2025 NPL ratio (also 0.9%) and the passing mention
#   "stable at 0.9% since mid-2024" (2025_en p13/25/100, 2025_zh p9/13/25). Kept 2025_en p98/p105 comparative columns
#   and the Group row of the NPA-by-geography tables (2024_en p105, 2025_en p105).
# - v11: 2023_en p98 "151%" is the 2023 coverage.
# - v16: notes to the financial statements (2025_en p152 accounting policy; p161/p162 tax note incl. $41m Pillar Two tax)
#   were not added — they quantify tax but are not the analysis explaining the profit decline.
# - v15: 2025_en p13 (generic "wealth, trading and insurance delivered stellar income") and p15 (chart, no explanation) not added.
# - v18: 2024_zh p14 ("支出收入比例依然低于40%") only mentions CIR, not the opex drivers.
#
# NOT FOUND / NOTES
# - The zh reports contain no 2025 NIM, no leverage ratio / LCR text, and no MD&A tables; those golds are en-only.
# - 2025_en p25 dividend chart and 2023_en p13 dividend chart have no extractable numbers (not in gold).
# - Leverage ratio (v12) and all-currency LCR (v13) appear only in the 2025_en MD&A key ratios table (p98).
# - v06 2023: 2023 interim 40c + final 42c = 82c; 2024 = interim 44c + final 41c + special 16c = $1.01.
#
