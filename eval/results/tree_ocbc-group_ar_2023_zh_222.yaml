  start_page_text: 欧洲 中东 集团一体， 展现优势 银行业 华侨银行集团的银行实体是东盟主要经济体 (包括新加坡、 马来西亚和印度尼西亚) 与大中华地区的当地注册商业银行。 我们在东盟和大中华区拥有最全面的业务覆盖，让我们能够
    满足银行服务的需求，实现企业和个人的理想。 我们的这些银行附属公司在新加坡、马来西亚与印度尼西亚等 东盟领先经济体设有超过330家分行和办事处，在中国内地、 香港特别行政区和澳门特别行政区则
