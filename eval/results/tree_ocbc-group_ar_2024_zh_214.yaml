  start_page_text: 马来西亚 星期日早上，超过2,700名脚车骑手汇聚在吉隆坡市区内，参加第 七届吉隆坡华侨银行骑车乐活动，这是本活动迄今参加人数最多 的一次。这些参加者来自各种行业和背景，在独立广场挥旗仪式 后，沿着吉隆坡市中心的21公里封闭道路上骑行。
    参与者可选择参加21公里赛项，或者42公里赛项，也就是沿活动 路线骑行两圈。活动也特别安排让小骑手参加，让他们用自己的 小脚车兴高采烈地沿着短赛道骑行。 澳门 2
